// PDF & Photo Toolkit for Android: a Trusted Web Activity. The app opens the
// toolkit web app full-screen in Chrome's engine, so every website update
// reaches the APK too, and the camera and file downloads work as in Chrome.
plugins { id 'com.android.application' }

def keystorePassword = System.getenv('PDFTOOLKIT_KEYSTORE_PASSWORD')

android {
    namespace 'io.github.rlm1711204.pdftoolkit'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.rlm1711204.pdftoolkit'
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName(project.findProperty('versionName') ?: '4.0.0')
    }

    signingConfigs {
        release {
            // The key file is encrypted; its password lives only in the
            // GitHub secret PDFTOOLKIT_KEYSTORE_PASSWORD.
            storeFile file('../pdftoolkit-release.p12')
            storeType 'pkcs12'
            storePassword keystorePassword
            keyAlias 'pdftoolkit'
            keyPassword keystorePassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
